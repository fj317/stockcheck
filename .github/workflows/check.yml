name: check-page
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 0.6.5 is the last release that runs without a license key
      - run: pip install cloakbrowser==0.6.5
      - uses: actions/cache@v4
        with:
          path: ~/.cloakbrowser  # the ~200 MB Chromium binary
          key: cloakbrowser-0.6.5-${{ runner.os }}
      - run: python check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
